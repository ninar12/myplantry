<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm cream background -->
  <rect width="32" height="32" rx="8" fill="#F5EFE0"/>

  <!-- Jar body - warm clay/terracotta outline style -->
  <rect x="10.5" y="19.5" width="11" height="9" rx="2.5" fill="#C8A97A" opacity="0.25"/>
  <rect x="10.5" y="19.5" width="11" height="9" rx="2.5" fill="none" stroke="#7A5C3A" stroke-width="1.5"/>

  <!-- Jar band/shoulder -->
  <rect x="8.5" y="16.5" width="15" height="3.5" rx="1.5" fill="#C8A97A" opacity="0.3"/>
  <rect x="8.5" y="16.5" width="15" height="3.5" rx="1.5" fill="none" stroke="#7A5C3A" stroke-width="1.5"/>

  <!-- Jar lid -->
  <rect x="11" y="14" width="10" height="3" rx="1.5" fill="#9B6E3E" opacity="0.5"/>
  <rect x="11" y="14" width="10" height="3" rx="1.5" fill="none" stroke="#7A5C3A" stroke-width="1.5"/>

  <!-- Stem -->
  <line x1="16" y1="27" x2="16" y2="12.5" stroke="#4A7C59" stroke-width="2" stroke-linecap="round"/>

  <!-- Left leaf - organic curve -->
  <path d="M16 18 C14 16 10.5 13 10.5 9.5 C13.5 9.5 16 15 16 18Z" fill="#7DB87A" stroke="#4A7C59" stroke-width="0.75"/>

  <!-- Right leaf - organic curve, slightly higher -->
  <path d="M16 14.5 C18 12.5 21.5 9.5 22 6.5 C18.5 6.5 16 11.5 16 14.5Z" fill="#5A9E6A" stroke="#4A7C59" stroke-width="0.75"/>
</svg>
