<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#003527"/>

  <!-- Jar body -->
  <rect x="11" y="20" width="10" height="9" rx="1.5" fill="white"/>

  <!-- Glass interior cutout -->
  <rect x="12.5" y="21" width="7" height="7" rx="0.75" fill="#003527"/>

  <!-- Jar band (wider than body, creates shoulder) -->
  <rect x="9" y="17" width="14" height="3.5" rx="0.75" fill="white"/>

  <!-- Jar lid cap (narrower than band) -->
  <rect x="11.5" y="14.5" width="9" height="2.5" rx="1" fill="white"/>

  <!-- Stem — runs from inside jar up through lid -->
  <line x1="16" y1="28" x2="16" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Left leaf (points upper-left, alternate phyllotaxy) -->
  <path d="M16 17.5 C13.5 15.5 9 12 9 8 C12.5 8 16 14 16 17.5Z" fill="white"/>

  <!-- Right leaf (points upper-right, slightly higher) -->
  <path d="M16 13.5 C18.5 11.5 22.5 8 22.5 5 C19 5 16 10.5 16 13.5Z" fill="white"/>
</svg>
